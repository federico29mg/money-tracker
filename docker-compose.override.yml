# Local development settings. Docker Compose merges this file automatically with docker-compose.yml.

services:
  sqlserver:
    ports:
      - "1433:1433"

  servicebus-emulator:
    ports:
      - "5672:5672"
      - "5300:5300"

  users-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5100:8080"
    
  transactions-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5101:8080"